[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.2.0",
    "boto3==1.43.86",
    "requests",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = [
    "pytest",
]
[tool.setuptools.packages.find]
where = ["src"]