services:
  airflow-scheduler:
    image: atlas-airflow:3.3.2
    command: scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/atlas/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/      
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://atlas-raw-data-6304/airflow-logs"
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "aws_default"
      AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "false"     
      AIRFLOW_CONN_ATLAS_SNOWFLAKE: >-
        {"conn_type":"snowflake","login":"${SNOWFLAKE_USER}","password":"${SNOWFLAKE_PASSWORD}","schema":"STAGING","extra":{"account":"${SNOWFLAKE_ACCOUNT}","database":"ATLAS_DB","warehouse":"ATLAS_WH","role":"ACCOUNTADMIN"}}
    volumes:
      - airflow-data:/opt/airflow
      - ~/.aws:/home/airflow/.aws:ro
    restart: unless-stopped
  airflow-dag-processor:
    image: atlas-airflow:3.3.2
    command: dag-processor
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/atlas/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/      
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - airflow-data:/opt/airflow
      - ~/.aws:/home/airflow/.aws:ro
    restart: unless-stopped
  airflow-api:
    image: atlas-airflow:3.3.2
    command: api-server
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/atlas/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__API__PORT: "8080"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://atlas-raw-data-6304/airflow-logs"
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "aws_default"
      AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "false"
      AIRFLOW_CONN_ATLAS_SNOWFLAKE: >-
        {"conn_type":"snowflake","login":"${SNOWFLAKE_USER}","password":"${SNOWFLAKE_PASSWORD}","schema":"STAGING","extra":{"account":"${SNOWFLAKE_ACCOUNT}","database":"ATLAS_DB","warehouse":"ATLAS_WH","role":"ACCOUNTADMIN"}}
    volumes:
      - airflow-data:/opt/airflow
      - ~/.aws:/home/airflow/.aws:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  airflow-data: